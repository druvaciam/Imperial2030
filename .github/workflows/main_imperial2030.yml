# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - Imperial2030

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: dotnet publish
        run: dotnet publish Server/Imperial2030.Server.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp" /p:PublishSingleFile=false

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp
          retention-days: 7

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C5D2FEA92B2D4C6984D21877E3BC60BD }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4CCECBE558AE4E978A6CCC0B28709748 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_923684076B4A4CF8B6CFE04227BABC8E }}

      # OneDeploy returns an intermittent 500 on this app. The site already runs with
      # WEBSITE_RUN_FROM_PACKAGE=1, so this is NOT the classic "extracting over locked files" failure -
      # each deploy uploads a fresh ~100MB zip (of which ~59MB is ONNX model weights) and swaps the mount.
      #
      # A single retry clears the transient ones, which is all this step claims to do. If failures become
      # consistent rather than intermittent, see azure-deploy.info.txt - the leading suspect is the
      # SitePackages share filling up, since run-from-package keeps a zip per deployment.
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        continue-on-error: true
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Imperial2030'
          slot-name: 'Production'
          package: .

      - name: Retry deploy to Azure Web App
        id: retry-deploy-to-webapp
        if: steps.deploy-to-webapp.outcome == 'failure'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Imperial2030'
          slot-name: 'Production'
          package: .

      # continue-on-error above hides a first-attempt failure from the job status, so a genuine failure
      # would otherwise report success when the retry was skipped. It never is skipped when the first
      # attempt failed, but this makes the job fail loudly rather than depending on that reasoning.
      - name: Fail if both deploy attempts failed
        if: steps.deploy-to-webapp.outcome == 'failure' && steps.retry-deploy-to-webapp.outcome != 'success'
        run: exit 1
          
