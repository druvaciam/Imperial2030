# nginx in front of the game, inside Docker. Listens on 80 inside its container; start.sh decides
# which port of the machine that becomes (8080 unless told otherwise).
server {
    listen 80;
    server_name _;

    # Look the game up through Docker's DNS on every request rather than once at startup: an update
    # recreates the game container with a new address, and a remembered one would answer 502.
    resolver 127.0.0.11 valid=10s;
    set $game http://app:8080;

    location / {
        proxy_pass $game;
        proxy_http_version 1.1;
        # SignalR (live game updates) needs the WebSocket upgrade passed through.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # $http_host keeps the port the player used, so anything the app builds from it points back here.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # A game page can stay open for hours on one WebSocket.
        proxy_read_timeout 1h;
    }
}
