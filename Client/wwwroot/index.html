<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Imperial2030</title>
    <base href="/" />
    <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" />
    <!-- Bootstrap Icons (MIT). Vendored under wwwroot rather than pulled from a CDN, matching how
         bootstrap and open-iconic are already shipped, so the app stays self-contained offline.
         The markup has used bi-* classes all along but this stylesheet was never added, so every
         one of them silently rendered at zero width. -->
    <link href="css/bootstrap-icons/bootstrap-icons.css" rel="stylesheet" />
    <link href="css/app.css?v=4" rel="stylesheet" />
    <link href="Imperial2030.Client.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div
            style="position:fixed;top:0;left:0;width:100%;height:100%;background-color:#1a1a1d;display:flex;align-items:center;justify-content:center;color:#f1c40f;font-family:sans-serif;flex-direction:column;">
            <div class="spinner-border text-warning" role="status"
                style="width: 3rem; height: 3rem; margin-bottom: 1rem;"></div>
            <h2 id="boot-loading">Loading Imperial 2030...</h2>
        </div>
    </div>

    <div id="blazor-error-ui">
        <!-- Minimal error UI -->
        <span id="boot-error" style="font-size: 0.9rem;">Something went wrong.</span>
        <a href="" class="reload" id="boot-reload" style="color: #f1c40f; font-weight: bold; margin-left: 10px;">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script>
        // This markup renders before .NET starts, so it cannot use IStringLocalizer. It reads the
        // same localStorage key LanguageService writes and swaps the handful of boot strings itself.
        // Keep these in sync with SharedResource.resx if the wording there changes.
        (function () {
            var translations = {
                be: {
                    title: 'Imperial 2030',
                    loading: 'Загрузка Imperial 2030...',
                    error: 'Нешта пайшло не так.',
                    reload: 'Перазагрузіць'
                }
            };
            try {
                var culture = localStorage.getItem('Imperial2030.culture');
                document.documentElement.lang = culture || 'en';
                var t = translations[culture];
                if (!t) return;
                document.title = t.title;
                document.getElementById('boot-loading').textContent = t.loading;
                document.getElementById('boot-error').textContent = t.error;
                document.getElementById('boot-reload').textContent = t.reload;
            } catch (e) {
                // Storage unavailable (private mode / blocked cookies) — keep the English default.
            }
        })();
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        window.updateTerritoryTooltips = (tooltips) => {
            for (const [id, text] of Object.entries(tooltips)) {
                const element = document.getElementById(id);
                if (element) {
                    const title = document.createElementNS("http://www.w3.org/2000/svg", "title");
                    title.textContent = text;
                    // Remove existing title if any
                    const existingTitle = element.querySelector('title');
                    if (existingTitle) {
                        element.removeChild(existingTitle);
                    }
                    element.appendChild(title);
                }
            }
        };

        window.scrollToBottom = (element) => {
            if (element) {
                element.scrollTop = element.scrollHeight;
            }
        };

        // Follow new content only while the reader is already at the bottom. Scrolling up to read
        // back unpins the element and it stays put - otherwise the next update (a replay step, a
        // bot's turn) yanks the view away mid-sentence, which made scrolling back impossible.
        // Re-pins by itself as soon as the reader returns to the bottom.
        const AUTO_SCROLL_PIN_THRESHOLD_PX = 40;

        const isPinnedToBottom = (element) =>
            element.scrollHeight - element.scrollTop - element.clientHeight <= AUTO_SCROLL_PIN_THRESHOLD_PX;

        window.scrollToBottomIfPinned = (element) => {
            if (!element) return;

            if (!element.dataset.autoScrollBound) {
                element.dataset.autoScrollBound = "1";
                // Recorded on every scroll, user-driven or programmatic. A programmatic scroll ends at
                // the bottom and so re-pins, which is what we want.
                element.dataset.pinned = "1";
                element.addEventListener("scroll", () => {
                    element.dataset.pinned = isPinnedToBottom(element) ? "1" : "0";
                }, { passive: true });
            }

            // The render that triggered this already appended content, so the recorded flag - taken
            // before it - is the honest answer to "was the reader following along?".
            if (element.dataset.pinned !== "0") {
                element.scrollTop = element.scrollHeight;
            }
        };
    </script>
</body>

</html>
