<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Imperial2030</title>
    <base href="/" />
    <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="Imperial2030.Client.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div
            style="position:fixed;top:0;left:0;width:100%;height:100%;background-color:#1a1a1d;display:flex;align-items:center;justify-content:center;color:#f1c40f;font-family:sans-serif;flex-direction:column;">
            <div class="spinner-border text-warning" role="status"
                style="width: 3rem; height: 3rem; margin-bottom: 1rem;"></div>
            <h2>Loading Imperial 2030...</h2>
        </div>
    </div>

    <div id="blazor-error-ui">
        <!-- Minimal error UI -->
        <span style="font-size: 0.9rem;">Something went wrong.</span>
        <a href="" class="reload" style="color: #f1c40f; font-weight: bold; margin-left: 10px;">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        window.updateTerritoryTooltips = (tooltips) => {
            for (const [id, text] of Object.entries(tooltips)) {
                const element = document.getElementById(id);
                if (element) {
                    const title = document.createElementNS("http://www.w3.org/2000/svg", "title");
                    title.textContent = text;
                    // Remove existing title if any
                    const existingTitle = element.querySelector('title');
                    if (existingTitle) {
                        element.removeChild(existingTitle);
                    }
                    element.appendChild(title);
                }
            }
        };
    </script>
</body>

</html>
